name: Update cfg.json Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cfg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch GitHub Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ===== 1. Профиль =====
          USER_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/users/rud1x)
          REPOS=$(echo "$USER_DATA" | jq '.public_repos // 0')
          FOLLOWERS=$(echo "$USER_DATA" | jq '.followers // 0')
          FOLLOWING=$(echo "$USER_DATA" | jq '.following // 0')
          GISTS=$(echo "$USER_DATA" | jq '.public_gists // 0')

          # ===== 2. Все репозитории (до 100) =====
          REPOS_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/rud1x/repos?per_page=100&sort=updated")

          # Суммарные звёзды
          STARS=$(echo "$REPOS_DATA" | jq '[.[].stargazers_count] | add // 0')
          FORKS_TOTAL=$(echo "$REPOS_DATA" | jq '[.[].forks_count] | add // 0')

          # Разбивка по каждому репо
          REPO_STARS=$(echo "$REPOS_DATA" | jq '
            [.[] | {
              key: .full_name,
              value: {
                name: .name,
                fullName: .full_name,
                description: .description,
                url: .html_url,
                homepage: .homepage,
                stars: .stargazers_count,
                forks: .forks_count,
                watchers: .watchers_count,
                issues: .open_issues_count,
                language: .language,
                topics: .topics,
                archived: .archived,
                fork: .fork,
                createdAt: .created_at,
                updatedAt: .updated_at,
                pushedAt: .pushed_at
              }
            }] | from_entries')

          # ===== 3. Коммиты / PR / Issues =====
          COMMITS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.cloak-preview" \
            "https://api.github.com/search/commits?q=author:rud1x" | jq '.total_count // 0')

          PRS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/search/issues?q=author:rud1x+type:pr" | jq '.total_count // 0')

          ISSUES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/search/issues?q=author:rud1x+type:issue" | jq '.total_count // 0')

          NOW=$(date -Iseconds)

          # ===== 4. Сборка cfg.json =====
          jq -n \
            --argjson repos "$REPOS" \
            --argjson stars "$STARS" \
            --argjson followers "$FOLLOWERS" \
            --argjson following "$FOLLOWING" \
            --argjson gists "$GISTS" \
            --argjson forksTotal "$FORKS_TOTAL" \
            --argjson commits "$COMMITS" \
            --argjson prs "$PRS" \
            --argjson issues "$ISSUES" \
            --arg updated "$NOW" \
            --argjson repoStars "$REPO_STARS" \
            '{
              repos: $repos,
              stars: $stars,
              forks: $forksTotal,
              followers: $followers,
              following: $following,
              gists: $gists,
              totalCommits: $commits,
              pullRequests: $prs,
              issues: $issues,
              repoStars: $repoStars,
              updatedAt: $updated
            }' > cfg.json

          cat cfg.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet cfg.json; then
            echo "No changes"
          else
            git add cfg.json
            git commit -m "chore: update GitHub stats"
            git push origin main
          fi
