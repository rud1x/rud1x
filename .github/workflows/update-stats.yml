name: Update cfg.json Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cfg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch GitHub Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ===== 1. Профиль =====
          USER_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/users/rud1x)
          FOLLOWERS=$(echo "$USER_DATA" | jq '.followers // 0')
          FOLLOWING=$(echo "$USER_DATA" | jq '.following // 0')
          GISTS=$(echo "$USER_DATA" | jq '.public_gists // 0')

          # ===== 2. Все репозитории =====
          REPOS_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/rud1x/repos?per_page=100&sort=updated")

          # ===== 3. Только свои проекты (без форков) =====
          OWN_REPOS=$(echo "$REPOS_DATA" | jq '[.[] | select(.fork == false)]')

          REPOS=$(echo "$OWN_REPOS" | jq 'length')
          STARS=$(echo "$OWN_REPOS" | jq '[.[].stargazers_count] | add // 0')
          FORKS_TOTAL=$(echo "$OWN_REPOS" | jq '[.[].forks_count] | add // 0')

          # ===== 4. Разбивка по всем репам (с пометкой fork) =====
          REPO_STARS=$(echo "$REPOS_DATA" | jq '
            [.[] | {
              key: .full_name,
              value: {
                name: .name,
                fullName: .full_name,
                description: .description,
                url: .html_url,
                homepage: .homepage,
                stars: .stargazers_count,
                forks: .forks_count,
                watchers: .watchers_count,
                issues: .open_issues_count,
                language: .language,
                topics: .topics,
                archived: .archived,
                fork: .fork,
                createdAt: .created_at,
                updatedAt: .updated_at,
                pushedAt: .pushed_at
              }
            }] | from_entries')

          # ===== 5. Коммиты / PR / Issues =====
          COMMITS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.cloak-preview" \
            "https://api.github.com/search/commits?q=author:rud1x" | jq '.total_count // 0')

          PRS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/search/issues?q=author:rud1x+type:pr" | jq '.total_count // 0')

          ISSUES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/search/issues?q=author:rud1x+type:issue" | jq '.total_count // 0')

          # ===== 6. Релизы (только не форки) =====
          REPO_NAMES=$(echo "$OWN_REPOS" | jq -r '.[].full_name')
          TIMELINE_ITEMS="[]"

          for REPO_NAME in $REPO_NAMES; do
            RELEASES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO_NAME/releases?per_page=10")

            IS_ARRAY=$(echo "$RELEASES" | jq 'type == "array"')
            if [ "$IS_ARRAY" != "true" ]; then
              continue
            fi

            REPO_EVENTS=$(echo "$RELEASES" | jq \
              --arg repo "$REPO_NAME" \
              '[.[] | {
                type: "release",
                repo: $repo,
                title: .name,
                tag: .tag_name,
                body: (.body | if . == null then "" else . end | split("\n")[0] // ""),
                url: .html_url,
                date: (.published_at // .created_at)
              }]')

            TIMELINE_ITEMS=$(jq -n \
              --argjson acc "$TIMELINE_ITEMS" \
              --argjson new "$REPO_EVENTS" \
              '$acc + $new')
          done

          TIMELINE_SORTED=$(echo "$TIMELINE_ITEMS" | jq 'sort_by(.date) | reverse | .[:10]')

          NOW=$(date -Iseconds)

          # ===== 7. Сборка cfg.json =====
          jq -n \
            --argjson repos "$REPOS" \
            --argjson stars "$STARS" \
            --argjson followers "$FOLLOWERS" \
            --argjson following "$FOLLOWING" \
            --argjson gists "$GISTS" \
            --argjson forksTotal "$FORKS_TOTAL" \
            --argjson commits "$COMMITS" \
            --argjson prs "$PRS" \
            --argjson issues "$ISSUES" \
            --arg updated "$NOW" \
            --argjson repoStars "$REPO_STARS" \
            --argjson timeline "$TIMELINE_SORTED" \
            '{
              repos: $repos,
              stars: $stars,
              forks: $forksTotal,
              followers: $followers,
              following: $following,
              gists: $gists,
              totalCommits: $commits,
              pullRequests: $prs,
              issues: $issues,
              repoStars: $repoStars,
              timeline: $timeline,
              updatedAt: $updated
            }' > cfg.json

          cat cfg.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet cfg.json; then
            echo "No changes"
          else
            git add cfg.json
            git commit -m "chore: update GitHub stats"
            git push origin main
          fi
